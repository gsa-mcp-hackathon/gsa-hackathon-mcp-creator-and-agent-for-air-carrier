# Type checking for the MCP servers. scripts/check.sh runs mypy once per
# project, inside that project's own environment, with this one file:
#
#   scripts/check.sh docs        # tests, lint, then mypy over src
#
# Three groups of modules:
#   1. The return models every tool publishes as its output schema: strict.
#   2. Everything else: checked, including the bodies of untyped functions.
#   3. The baseline at the bottom: modules with open type errors on
#      2026-11-22, named one by one so the debt is visible. A new error in any
#      other module fails the build. Remove a name when its module is clean.

[mypy]
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
ignore_missing_imports = True

# 1. The published return models.
[mypy-mcp_aircarrier_docs.output_models,mcp_aircarrier_analyst.output_models,mcp_aircarrier_ops.output_models,mcp_server_creator.output_models,hub_models]
disallow_untyped_defs = True
disallow_any_generics = True

# A tool declares its return model so the MCP listing carries an output schema,
# and returns the plain dict that FastMCP checks against it. In these modules
# the dict is written in the tool itself, which mypy reads as a mismatch.
[mypy-mcp_server_creator.tools.*,mcp_aircarrier_ops.tools.*]
disable_error_code = return-value

# 3. Baseline: mcp-aircarrier-docs (5 of 21 modules).
[mypy-docs_core.corpus,docs_core.tieout,mcp_aircarrier_docs.service,mcp_aircarrier_docs.source_notice,mcp_aircarrier_docs.volume]
ignore_errors = True

# Baseline: mcp-aircarrier-analyst (9 of 20 modules).
[mypy-core.analyst.backtest,core.analyst.engine,core.analyst.learn,core.analyst.loa,core.analyst.residual,mcp_aircarrier_analyst.investigator,mcp_aircarrier_analyst.library,mcp_aircarrier_analyst.service,mcp_aircarrier_analyst.source_notice]
ignore_errors = True

# Baseline: mcp-aircarrier-ops and the generated bakehouse server. The two
# copied files (source_notice, error_contract) are the same in every server.
[mypy-mcp_aircarrier_ops.error_contract,mcp_aircarrier_ops.source_notice,mcp_aircarrier_ops.tools.mcp_work_register_totals,bakehouse_sales.error_contract,bakehouse_sales.source_notice]
ignore_errors = True

# Baseline: aircarrier-mcp-probe (1 of 2 modules).
[mypy-probe]
ignore_errors = True

# Baseline: MCP A Creator (12 of 46 modules).
[mypy-mcp_server_creator.designer,mcp_server_creator.doctor,mcp_server_creator.error_contract,mcp_server_creator.generators.databricks,mcp_server_creator.generators.project,mcp_server_creator.generators.toolcode,mcp_server_creator.live,mcp_server_creator.profiling,mcp_server_creator.review.rubric,mcp_server_creator.source_notice,mcp_server_creator.tools.deploy_server,mcp_server_creator.tools.write_project]
ignore_errors = True

# Baseline: the One Hub server module (hub_models and source_notice are checked).
[mypy-mcp_server]
ignore_errors = True
