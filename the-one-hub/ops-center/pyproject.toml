[project]
name = "aircarrier"
version = "0.1.0"
description = "Air Carrier program cost tracking. Ops center and front center."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "mlflow>=3.0",
  "databricks-sdk>=0.40",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  # checks/test_mcp_server.py builds the server; mcp 2.0 removed mcp.server.fastmcp.
  "mcp>=1.2.0,<2",
  # checks/test_harness.py fakes Spark but imports pyspark types; no cluster needed.
  "pyspark>=3.5",
]

# uv manages the lock file. The lock is what makes the build reproducible when
# someone else redeploys it, and it is required for IL5 where PyPI is not
# reachable at build time and wheels must be vendored. See docs/DEPLOY.md.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Databricks Git folders and Windows checkouts do not keep the executable bit,
# so a shebang on a script run as `python script.py` is not an error here.
ignore = ["EXE001"]

[tool.ruff.lint.per-file-ignores]
# Jobs, ETL, operator tools and check scripts run one item after another: a
# broad catch reports the failure and moves on instead of stopping the batch.
# The rule stays on for core/, ops/ (outside entrypoints) and app/, where every
# broad catch carries its reason on the line.
"tools/*" = ["BLE001", "S110"]
"etl/*" = ["BLE001"]
"ops/entrypoints/*" = ["BLE001", "SIM115"]
# Checks load serverless entrypoints with exec, as the job runner does, and
# open small fixture files inline.
"checks/*" = ["BLE001", "S102", "SIM115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ops"]
