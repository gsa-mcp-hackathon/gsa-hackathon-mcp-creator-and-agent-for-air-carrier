  hull: CVN-79
  name: JOHN F. KENNEDY
  class: CVN 78 GERALD R. FORD
  program: CVN 78 Gerald R. Ford Class Nuclear Aircraft Carrier
  acat: IC
  program_office: PEO Carriers

budget:
  appropriation: 1611N
  treasury_main_account: "1611"
  agency: "017"
  tafs_form: "017-1611 YYYY/YYYY"
  legacy_symbol_form: "17*1611"
  budget_activities: {"02": Other Warships, "05": "Auxiliaries, craft, prior-year program costs"}
  line_items:
    "2001": Carrier Replacement Program    # also written 200100
    "5110": Outfitting
    "5300": Completion of PY Shipbuilding Programs
  program_element: 0204112N
  shared_rdte_element: 0604112N            # DISTINCT. allocation method open, G4
  other_appropriations:
    - {appn: 1810N, ba: "04", li: "5664", name: Surface Training Equipment}
    - {appn: 1804N, ba: "01", li: 1B5B, name: Ship Depot Operations Support}
    - {appn: OPN}
    - {appn: RDT&E}
  subhead:
    length: 4
    encodes: [budget activity, P-1 line]
    maps_to: Navy ERP NWA or WBS
    note: >
      SCN is the one DON appropriation that is line-item appropriated. The
      subhead is therefore a structural pointer from the ledger to the Carrier
      Replacement Program line. The NWA/WBS node distinguishing CVN-79 from
      CVN-80/81 within BLI 2001 is the highest-value open item. G8.

