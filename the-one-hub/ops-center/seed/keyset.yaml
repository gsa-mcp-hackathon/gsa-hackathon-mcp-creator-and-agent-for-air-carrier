      why: appears in MSAR tables, scope unconfirmed
  resolved_not_this_hull:
    # Closed 2026-11-08 against the FPDS-NG ATOM feed. Both were carried as
    # "General Atomics, unresolved". Neither attribution survived the lookup.
    - piid: N00024-18-C-4100
      vendor: VERICOR POWER SYSTEMS LLC
      vendor_as_carried: General Atomics
      office: NAVSEA HQ N00024
      description: ETF40B POWER PRODUCER GROUP ASY(LCAC 86)
      base_and_all_options_usd: 19169760
      signed: 2017-11-22
      pricing: FFP
      verdict: not this hull. LCAC 86 is a landing craft air cushion.
      ref: G27
    - piid: N00024-14-C-4201
      vendor: null
      vendor_as_carried: General Atomics
      verdict: >
        absent from both the FPDS awardfull and IDV indexes on exact-match and
        free-text. A control query on N0002409C2116 returned a complete record
        from the same feed in the same session, so the absence is the finding
        and not a feed failure.
      ref: G27
  name_collision:
    term: John F. Kennedy
    why: CV-67, the previous USS John F. Kennedy, built at the same shipyard
    rule: Keyed searches must use the hull number.

