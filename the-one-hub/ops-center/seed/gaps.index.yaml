# This file carries only the fields the work register routes and ranks on.
# source: LOG.md Part II
#
# closability drives the Investigator's queue as much as exposure does:
#   zero_access      readable today with nothing but effort
#   query            a system already reachable
#   access_required  waits on sponsorship
#   sme              waits on a person, and decays
#   terminal         IRREDUCIBLE
#
# ignorance: 1.0 means nothing known. Inverse of the best confidence held.

