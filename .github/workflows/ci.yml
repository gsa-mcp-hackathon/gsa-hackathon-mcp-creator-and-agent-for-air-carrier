name: CI

# Every suite in the repository, from a clean checkout, on every push and PR.
# Each job runs scripts/check.sh for one project, the same command a reader
# runs locally, so the badge and a local run cannot disagree.

on:
  push:
    branches: [main, "enhance/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.project }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        project: [creator, ops, bakehouse, docs, analyst, probe, mcp-local, one-hub]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: scripts/check.sh ${{ matrix.project }}
        run: scripts/check.sh ${{ matrix.project }}

  compatibility:
    name: Creator and a generated project on FastMCP ${{ matrix.fastmcp }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor every pin allows, and current (MCP SDK 2, protocol 2026-07-28).
        fastmcp: ["3.4.11", "4.2.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: scripts/check_compat.sh ${{ matrix.fastmcp }}

  supply-chain:
    name: known vulnerabilities in every deployed server's requirements
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - mcp-server-creator/requirements.txt
          - mcp-servers/mcp-aircarrier-docs/requirements.txt
          - mcp-servers/mcp-aircarrier-analyst/requirements.txt
          - mcp-servers/mcp-aircarrier-ops/requirements.txt
          - mcp-servers/aircarrier-mcp-probe/requirements.txt
          - the-one-hub/ops-center/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pip-audit -r ${{ matrix.requirements }} --progress-spinner off

  evidence:
    name: links resolve, published results match the raw runs, round 4 grader tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: scripts/check.sh evidence
