[project]
name = "mcp-aircarrier-ops"
version = "0.1.0"
description = "Let an agent answer CVN-79 cost-reconciliation questions from the Air Carrier lossless stores, returning every figure with its page or row coordinate, legends, tag and source, and never promoting a figure on its own."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.30.0",
    "databricks-sql-connector>=3.0.0",
    "fastmcp>=3.2,<4",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-aircarrier-ops = "mcp_aircarrier_ops.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_aircarrier_ops"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.bandit]
# Tests use assert by design. Run: bandit -c pyproject.toml -r .
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
