# Databricks Apps runtime configuration.
#
# `command` is a sequence and is NOT run through a shell, so environment
# variables are not expanded in it. The one exception is DATABRICKS_APP_PORT,
# which the platform substitutes at runtime. Because this project uses a src/
# layout, a shell is invoked explicitly to put the package on the path.
#
# The MCP endpoint is https://<app-hostname>/mcp, with health at /health.
#
# Self-heal: the app's environment persists across deployments and pip
# upgrades it in place. Going from FastMCP 2.x to 3.4, pip installs the new
# fastmcp-slim package (which now holds the fastmcp module) and then removes
# the old 2.x files at the same paths, leaving fastmcp/ with no __init__.py.
# `import fastmcp` still succeeds on that; `from fastmcp import FastMCP` does
# not. So the check imports FastMCP, and on failure fastmcp, fastmcp-slim and
# mcp are wiped and reinstalled before start (finding 30).
command:
  - /bin/sh
  - -c
  - >-
    export PYTHONPATH=/app/python/source_code/src:$PYTHONPATH &&
    { python -c "from fastmcp import FastMCP" >/dev/null 2>&1 || {
    SP=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])");
    echo "fastmcp is missing or incomplete in $SP, reinstalling";
    rm -rf "$SP/fastmcp" "$SP/mcp";
    python -m pip install --no-cache-dir --force-reinstall --no-deps
    "fastmcp-slim>=3.4,<4" "fastmcp>=3.4,<4" "mcp>=1.24,<2"; }; } &&
    python -m mcp_aircarrier_ops.app
env:
  # Shown as the owner on the app's landing page ('/').
  - name: APP_OWNER
    value: xiaobing.shang1.civ@mail.mil
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql_warehouse
  # <catalog>.<schema> holding the aircarrier_* stores (same variable as the
  # docs and analyst servers). The app service principal needs SELECT there.
  - name: AIRCARRIER_STORE_SCHEMA
    value: users.xiaobing_shang1_civ
