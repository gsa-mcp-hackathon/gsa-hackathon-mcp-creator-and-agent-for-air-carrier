[project]
name = "mcp-bakehouse-sales"
version = "0.1.0"
description = "Let an agent answer a bakery franchise sales analyst's questions about point-of-sale transactions: revenue by franchise, best-selling products, sales by payment method, and daily sales trends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.30.0",
    "databricks-sql-connector>=3.0.0",
    "fastmcp>=2.14,<3",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-bakehouse-sales = "mcp_bakehouse_sales.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bakehouse_sales"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
